# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/utdanning/larling
name: utdanning.larling
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper
  - felles
  - utdanning.utdanningsprogram

classes:

  Lærling:
    description: |
      Å være lærling betyr at du utdanner deg til et yrke ved å jobbe i en bedrift.
    attributes:
      systemId:
        range: Identifikator
        description: |
          Unik identifikator for en lærling.
        required: true
      kontraktstype:
        range: string
        description: |
          Kontraktstype for lærling.
      læretid:
        range: Periode
        description: |
          Tidsperiode for læretiden.
      bedrift:
        range: Virksomhet
        inverse: lærling
        annotations:
          primaryRelation: true
        description: |
          Bedriften hvor lærlingen har sin læretid.
      person:
        range: Person
        inverse: lærling
        annotations:
          primaryRelation: true
        description: |
          Person som er lærling.
        required: true
      programområdemedlemskap:
        range: Programområdemedlemskap
        inverse: lærling
        annotations:
          primaryRelation: true
        description: |
          Fagretning for læretiden.
        multivalued: true
