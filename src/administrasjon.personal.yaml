# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/administrasjon/personal
name: administrasjon.personal
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper
  - administrasjon.fullmakt
  - administrasjon.kodeverk
  - administrasjon.komplekse-datatyper
  - administrasjon.organisasjon
  - felles
  - utdanning.elev

classes:

  Fastlønn:
    description: |
      Informasjon om fast lønnsbeskjeftigelse.
      
      Inneholder beskjeftigelser av den ansattes lønnsprosent.
      
      Summen av prosentene på beskjeftigelsene skal være lønnsprosent for en fullt dekket stilling.
      
      Dersom beskjeftigelsene ikke fyller lønnsprosenten har arbeidsforholdet teknisk undertid. 
      
      I motsatt fall har arbeidsforholdet overtid.
      
      Kan også inneholde faste tillegg.
    is_a: Lønn
    attributes:
      beskjeftigelse:
        range: Beskjeftigelse
        annotations:
          writeable: true
        description: |
          Fordeling av den ansattes ansettelsesprosent. Beskriver hvor mye av prosenten som benyttes, og hvordan den skal konteres.
        multivalued: true
        required: true
      fasttillegg:
        range: Fasttillegg
        annotations:
          writeable: true
        description: |
          Faste tillegg til utbetaling.
        multivalued: true

  Fravær:
    description: |
      Fravær fra et arbeidsforhold.
      
      # Beskrivelse
      
      Representerer fravær fra et gitt arbeidsforhold. Fraværet har en type og en varighet, og kan være helt eller delvis.
    attributes:
      systemId:
        range: Identifikator
        description: |
          Unik identifikator i personalsystemet for fraværet.
        required: true
      periode:
        range: Periode
        annotations:
          writeable: true
        description: |
          Periode for fraværet.
          
          Forskjellige fraværstyper kan ha begrensninger i forhold til om perioden må være et antall timer eller et antall dager.
          
          Perioden angir både tidspunkt for fraværet og varighet av fraværet.
        required: true
      prosent:
        range: integer
        annotations:
          writeable: true
        description: |
          Prosent fraværende, i hundredels prosent.
          
          # Beskrivelse
          
          Andel av ansettelsesprosent den ansatte er fraværende.  Dersom fraværet er knyttet til flere arbeidsforhold, gjelder prosenten for summen av ansettelsesprosentene.
          
          # Eksempel
          
          - Helt sykemeldt fra 100% stilling:
            - 10000
          - 50% permisjon fra 80% stilling:
            - 4000
          - 80% gradert sykemelding fra to stillinger på 20% hver
            - 3200
        required: true
      arbeidsforhold:
        range: Arbeidsforhold
        inverse: fravær
        annotations:
          primaryRelation: true
        description: |
          Arbeidsforholdene fraværet gjelder for.
        multivalued: true
        required: true
      fortsettelse:
        range: Fravær
        inverse: fortsetter
        annotations:
          primaryRelation: true
        description: |
          Fortsettende fravær.
      fortsetter:
        range: Fravær
        inverse: fortsettelse
        annotations:
          primaryRelation: true
        description: |
          Fraværet som dette fraværet er fortsettende for.
      fraværsgrunn:
        range: Fraværsgrunn
        description: |
          Grunn til fraværet.
      fraværstype:
        range: Fraværstype
        description: |
          Type fravær.
        required: true

  Lønn:
    description: |
      Informasjon om lønn for et arbeidsforhold.
      
      # Beskrivelse
      
      Lønn (eller Lønnsmelding) inneholder informasjon om lønn som skal utbetales for et arbeidsforhold.  Lønn er enten Fastlønn eller Variabellønn.
      
      Lønnsmeldinger blir kontert, attestert og anvist av personalressurser som har fullmakter til dette.
      
      Lønn utbetales til et arbeidsforhold, for en gitt periode.
    abstract: true
    attributes:
      systemId:
        range: Identifikator
        annotations:
          writeable: true
        description: |
          Kildesystemets unike identifikator for lønnsmeldingen.
        required: true
      anvist:
        range: datetime
        annotations:
          writeable: true
        description: |
          Tidsstempel som angir når lønnsmeldingen ble anvist.
      attestert:
        range: datetime
        annotations:
          writeable: true
        description: |
          Tidsstempel som angir når lønnsmeldingen ble attestert.
      kontert:
        range: datetime
        annotations:
          writeable: true
        description: |
          Tidsstempel som angir når lønnsmeldingen ble kontert.
      periode:
        range: Periode
        annotations:
          writeable: true
        description: |
          Periode som lønnsmeldingen er gyldig for.
          
          # Eksempel
          
          - 01.08.2017 - 31.07.2018 (fastlønn for et skoleår)
          - 01.08.2017 - 31.08.2017 (for variabellønn)
          - 01.08.2017 og inntil videre (for øvrige faste ansatte)
          - 13.09.2017 - 15.09.2017 (for en vikar eller en sensor)
        required: true
      anviser:
        range: Personalressurs
        description: |
          Personalressurs som har anvist lønnsmeldingen etter fullmakt.
      arbeidsforhold:
        range: Arbeidsforhold
        inverse: lønn
        annotations:
          primaryRelation: true
        description: |
          Arbeidsforhold som mottar lønn
        required: true
      attestant:
        range: Personalressurs
        description: |
          Personalressurs som har attestert lønnsmeldingen etter fullmakt.
      konterer:
        range: Personalressurs
        description: |
          Personalressurs som har kontert lønnsmeldingen etter fullmakt.

  Variabellønn:
    description: |
      Informasjon om variabel lønn.
      
      # Beskrivelse
      
      Variabel lønn består av ett eller flere tillegg, hver knyttet til en lønnsart.  Lønnsart bestemmer eventuelle faste satser for tillegget, samt grunnlag for skatt- og pensjonstrekk, og hvordan det rapporteres på A-meldingen.
      
      Selve beregningen av variabel lønn gjøres av HRM, og formålet er å overføre tilstrekkelig informasjon til at HRM kan foreta beregningen.
    is_a: Lønn
    attributes:
      variabelttillegg:
        range: Variabelttillegg
        annotations:
          writeable: true
        description: |
          Alle tilleggene beskrevet i variabellønn.
        multivalued: true
        required: true

  Personalressurs:
    description: |
      Arbeidstaker eller oppdragstaker i organisasjonen
      
      # Beskrivelse
      
      Personalressurs er personer som leverer tjenester i form av å være ansatt. Personalressursen kan også være en person fra vikarbyrå, eller et firma som bekler et arbeidsforhold gjennom en kontrakt/avtale. Registrert i HR-systemet.
      
      # Eksempler
      
      * *ordinære* ansatte i faste og midlertidige stillinger
      * oppdragstakere: 
        * politikere
        * ressurser med timelønn
        * sensorer
        * eksamensvakt
        * hospitant
      
      Inneholder i utgangspunktet ikke *leverandørrepresenanter* (ekstern vikar, foredragsholdere, konsulenter).
    attributes:
      ansattnummer:
        range: Identifikator
        description: |
          Den unike identifIkatoren til en ansatt i ansatt-/ressursregistret i HR-systemet
          
          # Beskrivelse
          
          Identifiserer en personalressurs unikt. En personalressurs vil kun være registert med ett ansattnummer.
        required: true
      brukernavn:
        range: Identifikator
        annotations:
          writeable: true
        description: |
          Brukernavn til en ansatt
          
          # Beskrivelse
          
          Skal inneholde brukernavn for pålogging, som finnes i katalogtjenesten (feks Active Directory). Brukes som en identifikator som består, når fødselsnummer og/eller andre identifikatorer endrer seg.
          
          # Format
          
          Brukernavn i det format en personalressurs trenger for å logge seg på systemer i organisasjonen.
          
          # NB!
          
          Fremtidig funksjon for dette feltet er under revisjon.
      systemId:
        range: Identifikator
        description: |
          Unik intern system-id for personalressurs
          
          # Beskrivelse
          
          Systemspesifikk id, som normalt ikke er synlig i fagsystemet.
      ansettelsesperiode:
        range: Periode
        description: |
          Perioden personalressursen er i et forhold til fylkeskommunen
          
          # Beskrivelse
          
          * Startdato: Datoen for når personalressursen første gang begynte i fylkeskommunene.
          * Sluttdato: Dato for når personalressursen sitt forhold til fylkeskommunen opphører.
        required: true
      ansiennitet:
        range: date
        description: |
          Ansiennitet for personalressurs hos arbeidsgiver.
          
          # Beskrivelse
          
          Ansiennitet er normalt den ansattes tiltredelsesdato hos arbeidsgiver, men tariffavtalene fastsetter tilleggsregler blant annet for godskriving av tidligere offentlig og privat tjeneste.
          
          # Referanser
          
          - KS Hovedtariffavtalen § 12
          - Statens personalhåndbok 2018, kapittel 7.3.4
          - https://snl.no/ansiennitet
        required: true
      kontaktinformasjon:
        range: Kontaktinformasjon
        annotations:
          writeable: true
        description: |
          Arbeidsrelatert kontaktinformasjon til en personalressurs
          
          # Beskrivelse
          
          Den fortrukne måten å komme i kontakt med en personalressurs.
      arbeidsforhold:
        range: Arbeidsforhold
        inverse: personalressurs
        annotations:
          primaryRelation: true
        description: |
          Arbeidsforhold til en personalressurs
        multivalued: true
      fullmakt:
        range: Fullmakt
        inverse: fullmektig
        description: |
          Fullmakter som Personalressursen har blitt gitt.
        multivalued: true
      leder:
        range: Organisasjonselement
        inverse: leder
        description: |
          Ansvarlig leder for organisasjonselementet
          
          # Beskrivelse
          Normalt vil dette være leder som har personal- og økonomi-ansvar for dette organisasjonselementet.
          
          # Format
          Relasjon til en bestemt leder (Personalressurs).
          
          # Eksempler
        multivalued: true
      person:
        range: Person
        inverse: personalressurs
        description: |
          Person som er en personalressurs
        required: true
      personalansvar:
        range: Arbeidsforhold
        inverse: personalleder
        description: |
          Arbeidsforhold som Personalressurs har personalansvar for.
          
          # Beskrivelse
          
          Personalansvar
        multivalued: true
      personalressurskategori:
        range: Personalressurskategori
        description: |
          Angir hvilken kategori personalressurs
          
          # Beskrivelse
          
          Hvilken kategori/ansattform personalressursen innehar.
          
          # Format
          
          # Eksempel
          
          Kan for eksempel velges blant følgende: `Fast`, `Midlertidig`, `Oppdragstaker`, `Politiker`, `Sluttet`
          
          Se kodeverk Personalressurskategori for utvidet eksempel.
        required: true
      skoleressurs:
        range: Skoleressurs
        inverse: personalressurs
      stedfortreder:
        range: Fullmakt
        inverse: stedfortreder
        description: |
          Personalressurs som er stedfortreder for den fullmektige.
          
          # Beskrivelse
          
          Gjeldende stedfortreder innenfor angitt gyldighetsperiode til fullmakten.
          
          Dersom det finnes flere stedfortredere må kildesystemet velge den stedfortreder som er den primære. Stedfortreder må være tilgjengelig i perioden som fullmakten er gyldig.
        multivalued: true

  Arbeidsforhold:
    description: |
      Arbeidsforhold er et avtaleforhold mellom personalressurs og arbeidsgiver
      
      # Beskrivelse
      
      Arbeidsforhold defineres som et avtaleforhold hvor den ene part (arbeidstakeren / personalressurs) forplikter seg til å utføre arbeid for den annen part (arbeidsgiveren / organisasjonselement). Arbeidsforholdet kan også utføres av en person fra vikarbyrå, eller et firma gjennom en kontrakt/avtale.
      
      # Eksempler
      
      * Ansatt som rådgiver i fast stilling
      * Vikariat for en annen person som er i permisjon fra sitt arbeidsforhold
    attributes:
      systemId:
        range: Identifikator
        description: |
          Unik identifikator innenfor alle arbeidsforhold
          
          # Beskrivelse
          
          Unik identifikator innenfor alle arbeidsforhold til alle ansatte.
        required: true
      ansettelsesprosent:
        range: integer
        description: |
          Den prosenten personalressursen eier, i henholdt til arbeidsavtalen
          
          # Format
          Angitt fra 0 til 10000 i hundredelsprosent.
          
          # Eksempler
          
          * `1000` tilsvarer 10 %
          * `1033` tilsvarer 10,33 %
          * `8000` tilsvarer 80 %
          * `10000` tilsvarer 100 %
          * For tilkallingsvikar kan denne være `0`
        required: true
      gyldighetsperiode:
        range: Periode
        description: |
          Varigeheten til et bestemt arbeidsforhold
          
          # Beskrivelse
          
          Periode en personalressurs har vært (eller er) ansatt i et bestemt arbeidsforhold.
          
          Inneholder en dato for start, og kan inneholde slutt-dato.
        required: true
      hovedstilling:
        range: boolean
        description: |
          Angir hvilket arbeidsforhold som er hovedarbeidsforhold.
          
          # Beskrivelse
          
          Primærstillingen personalressursen er knyttet til, og som er grunnlaget for det juridiske arbeidsforholdet.
          
          En personalressurs kan ha flere arbeidsforhold, men kun en av disse kan være hovedstillingen.
          
          # Format
          
          true/false
        required: true
      lønn:
        range: Lønn
        inverse: arbeidsforhold
        description: |
          Alle lønnsutbetalinger for et arbeidsforhold
        multivalued: true
      lønnsprosent:
        range: integer
        description: |
          Prosent av årslønn den ansatte  skal ha utbetalt
          
          # Beskrivelse
          
          Det personalressursen skal ha utbetalt.
          
          # Format
          
          Angitt fra 0 til 10000 i hundredelsprosent.
        required: true
      stillingsnummer:
        range: string
        description: |
          En identifikator for stilling til en ansatt
          
          # Beskrivelse
          
          Løpenummer over stillinger som arbeidstaker har eller har hatt som ansattressurs i organisasjonen. Innenfor en ansatt og arbeidsforholdsperiode skal denne være unik.
          
          # Format
          
          Id-verdi til en stilling.
          
          # Eksempler
          
          For en personalressurs med tre arbeidsforhold, kan det være:
          `1`
          `2`
          `3`
        required: true
      stillingstittel:
        range: string
        annotations:
          writeable: true
        description: |
          Arbeidstakers stillingstittel i gjeldende stilling.
          
          # Beskrivelse
          
          Brukes i noen tilfeller som fritekst tittel slik at ansatte kan overstyre hva som skal vises på offentlige websider og intranett.
          
          Dette er ikke det samme som Stillingsbenevnelse som er titelen/tekstverdien til stillingskoden.
          
          # Format
          
          Tekst
          
          # Eksempler
          
          * "IT-sjef" (mens stillingsbenevnelse kan være "SEKSJONSLEDER"
          * "Rådgiver, IT" (mens stillingsbenevnelse kan være "Rådgiver 1"
      tilstedeprosent:
        range: integer
        description: |
          Det personalressursen faktisk jobber
          
          # Beskrivelse
          
          I hvilken prosentstørrelse personalressursen er tilgjengelig for arbeidsgiver.
          
          # Format
          
          Angitt fra 0 til 10000 i hundredelsprosent.
        required: true
      årslønn:
        range: integer
        description: |
          Årslønn/grunnlønn i 100 % stilling.
          
          # Beskrivelse
          Lønn i 100% stilling. Inneholder ikke definerte tillegg. Angis i øre.
          
          # Eksempel
          
          * `40000000` tilsvarer 400 000
        required: true
      ansvar:
        range: Ansvar
        description: |
          Relasjon til begrepet ansvar
          
          # Beskrivelse
          
          Beskriver hvilket ansvar arbeidsforholdet vanligvis knyttes til. 
          
          Synonymer:  kostsenter, kostnadsbærer.
          
          Se kodeverk [Ansvar](/docs/kodeverk_ansvar).
      arbeidsforholdstype:
        range: Arbeidsforholdstype
        description: |
          Beskrivende kode som kategoriserer hva slags funksjon stillingen grupperes til
          
          # Beskrivelse
          
          Beskrivende kode som kategoriserer hva slags funksjon stillingen grupperes til.
          
          Ansattkode eller stillingskategori som den også kalles.
          
          # Eksempler
          
          Se eksempel i Arbeidsforholdstype-kodeverk
      arbeidssted:
        range: Organisasjonselement
        inverse: arbeidsforhold
        annotations:
          primaryRelation: true
        description: |
          Tilhørighet til organisasjonsstruktur
          
          # Beskrivelse
          
          For eksempel koden til "Avdeling for Helse og mijlø".
          
          Kommentar fra feltet organisasjonId:
          Kode for relasjon til organisasjonstruktur. 
          
          Tilsvarer Arbeidssted i HR-system, mens VFS kaller dette for Ansvar og beskriver det med: "Type 2 = Ansvar, benyttes til å plassere den ansatte på riktig skole".
          
          For eksempel kode for "Bjerke videregående skole".
          
          Arbeid stedskode som er bygget på en eller flere organisasjonsenheter
          
          I en bedrift er en avdeling en organisasjonsenhet som utgjør ansvarsområdet til en (avdelings)sjef. Avdelingssjefen kan for eksempel hete formann, salgssjef eller kontorsjef. (ref.Store norske leksikon)
          
          # Format
          
          
          # Eksempler
        required: true
      fravær:
        range: Fravær
        inverse: arbeidsforhold
        description: |
          Alle fravær knyttet til arbeidsforhold.
        multivalued: true
      funksjon:
        range: Funksjon
        description: |
          Arbeidsforholdets relasjon til funksjon. 
          
          # Beskrivelse
          
          Beskriver hvilken funksjon arbeidsforholdet vanligvis knyttes til.
          
          Synonymer:  Tjeneste
          
          Se kodeverk [Funksjon](/docs/kodeverk_funksjon). 
          
          
          # Eksempler
          
          R1 Visma 2 kostra funksjoner:
          
          For eksempel koden til "Studiespesialisering" eller "PEDAGOGISK LEDELSE OG PEDAGOGISKE FELLESUTGIFTER".
      personalleder:
        range: Personalressurs
        inverse: personalansvar
        annotations:
          primaryRelation: true
        description: |
          Personalleder til et arbeidsforhold.
          
          # Beskrivelse
          
          Indikerer personalleder til et arbeidsforhold.
      personalressurs:
        range: Personalressurs
        inverse: arbeidsforhold
        description: |
          Pesonalressurs til et arbeidsforhold
        required: true
      stillingskode:
        range: Stillingskode
        description: |
          En fire- eller sekssifret stillingskode. Firesiffret kodeliste fra KS. Kan være utvidet i tillegg med to siffer. De to siste er egentilpasset.
          
          # Beskrivelse
          
          Se kodeverk Stillingskode.
          
          # Format
          
          # Eksempler
          
          # Referanser 
          
          Tar utgangspunkt i stillingskodene fra hovedtariffavtalen: [Oversikt over stillingskoder fra KS.no](http://www.ks.no/globalassets/vedlegg-til-hvert-fagomrader/arbeidsgiver/lonnpersonal---analyse-og-statistikk/innsamling-av-data/del-3---stillingskoder.pdf)
      timerPerUke:
        range: Uketimetall
        description: |
          Timer pr uke i 100% stilling
          
          # Beskrivelse
          
          Ulike type stillinger kan ha ulikt timetall for en 100% stilling
          
          # Format
          
          
          # Eksempler
      undervisningsforhold:
        range: Undervisningsforhold
        inverse: arbeidsforhold
        description: |
          Relasjon til en tilsvarende objekt i Utdannings domenet
