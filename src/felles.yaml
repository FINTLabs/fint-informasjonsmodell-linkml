# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/felles
name: felles
imports:
  - linkml:types
  - administrasjon.personal
  - felles.basisklasser
  - felles.kodeverk.iso
  - felles.komplekse-datatyper
  - utdanning.elev

classes:

  Kontaktperson:
    description: |
      Kontaktperson til en person.
      
      Det er to begrep som brukes avhengig av alder:
      
      * Under 18 år: Her vil foreldre normalt være både foresatte og pårørende
      * 18 år og eldre: Disse har ingen foresatte og de velger selv eventuelle pårørende som blir kontaktet i spesielle situasjoner
      
      # Referanser
      
      * "Foreldre, foresatte og pårørende" http://ndla.no/nb/node/66296?fag=8
      * "Behandle foresatte/pårørende" https://wisweb.uservoice.com/knowledgebase/articles/1804210-behandle-foresatte-p%C3%A5r%C3%B8rende
    attributes:
      systemId:
        range: Identifikator
        description: |
          Kildesystemets unike identifikator for kontaktperson.
        required: true
      foreldreansvar:
        range: boolean
        description: |
          Angir om kontaktpersonen har foreldreansvar for personen vedkommende er pårørende for.
        required: true
      type:
        range: string
        description: |
          Beskriver hva slags type kontaktperson.
          
          # Eksempel
          
          - forelder
          - ektefelle
          - barn
          - søsken
          - bestemor
        required: true
      kontaktperson:
        range: Person
        inverse: pårørende
        annotations:
          primaryRelation: true
        description: |
          Personen kontaktpersonen er pårørende for.
      person:
        range: Person
        description: |
          Person som er kontaktperson.
        required: true

  Person:
    description: |
      Fysiske private personer
      
      # Beskrivelse
      
      Fysiske personer. Arver felter fra [Aktør](Class:Aktør).
      
      # Eksempler
      
      ## Riktig
      
      * Karl August Haraldsen
      
      ## Feil
      
      * Statsminister
      
      # Referanse
      
      * [Wiki side](https://no.wikipedia.org/wiki/Fysisk_person)
    is_a: Aktør
    attributes:
      fødselsnummer:
        range: Identifikator
        description: |
          Fødselsnummer eller en av de fiktive variantene
          
          # Beskrivelse
          
          Et ellevesifret identifikasjonsnummer som alle folkeregistrerte i Norge har. Fødselsnummeret består av fødselsdato (6 siffer) og personnummer (5 siffer).
          
          # Format 
          
          11 siffer
          
          # Referanser
          
          * [Wiki side](https://no.wikipedia.org/wiki/Fødselsnummer)
          * [Registreringshåndboken A01.Fødselsnummer](http://regbok.udir.no/35004/3344/35042-1027331.html)
        required: true
      bilde:
        range: string
        description: |
          HTTP(S) lenke til et bilde av en person.
          
          Det forutsettes at det er bilde med den beste oppløsningen mulig.
      bostedsadresse:
        range: Adresse
        annotations:
          writeable: true
        description: |
          Folkeregsitreret adresse til en person
          
          # Format
          
          Se beskrivelse av [klasse Adresse](Class:Adresse)
      fødselsdato:
        range: date
        description: |
          Dato for fødsel
          
          # Format
          
          ISO 8601 format YYYY-MM-DDThh:mm:ssZ.
          
          # Referanser
          
          * [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
          
          # Eksempler
          
          ## Riktig
          
          * `1990-03-29T00:00:00Z`
          
          # Feil
          
          * `26.05.1678`
          * `29. Mar 1984`
          * `Første januar`
          * `I fjor`
      navn:
        range: Personnavn
        description: |
          Angir navn på en person. 
          
          # Beskrivelse
          
          Se beskrivelse for [Personnavn klasse](Class:Personnavn)
        required: true
      elev:
        range: Elev
        inverse: person
        description: |
          En person kan være en elev
      kjønn:
        range: Kjønn
        description: |
          Kjønn for person.
          
          # Beskrivelse
          
          Se beskrivelse av [Kjønn klasse](Class:Kjønn)
      morsmål:
        range: Språk
        description: |
          Morsmål til en person
      målform:
        range: Språk
        description: |
          Språkform som denne personen foretrekker å bruke (i utgangspunktet - nynork, bokmål eller samisk).
      personalressurs:
        range: Personalressurs
        inverse: person
        annotations:
          primaryRelation: true
        description: |
          Personalressurs til person. Forhold som arbeidstaker.
      pårørende:
        range: Kontaktperson
        inverse: kontaktperson
        description: |
          Kontaktperson er pårørende til disse personene.
        multivalued: true
      statsborgerskap:
        range: Landkode
        description: |
          Alle statsborgerskap som personen har
        multivalued: true
