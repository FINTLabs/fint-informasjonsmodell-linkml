# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/vigo-kodeverk
name: vigo-kodeverk
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper

classes:

