          Vigo: videregaaende
        required: true
      grep:
        range: Grep
        description: |
          http://psi.udir.no/ontologi/kl06/merknad

  Fagtyper:
    description: |
      Gruppering av fag etter Rundskriv Udir-01-2017 og skriv fra Utdanningsdirektoratet om Føring av vitnemål og kompetansebevis for videregående opplæring i Kunnskapsløftet, pkt 2.5.
      
      http://psi.udir.no/ontologi/kl06/fagtype
      
      Utfyllende kommentar: http://regbok.udir.no/35004/3344/35042-1014305.html
      
      Kilde: https://www.vigo.no/vigokv/fagtype.action
      
      Tabell: FAGTYPE
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        description: |
          Vigo: fagtype
        required: true
      gyldigFoM:
        range: string
        description: |
          Vigo: gyldigfom
        required: true
      gyldigToM:
        range: string
        description: |
          Vigo: gyldigtom
        required: true
      navn:
        range: string
        description: |
          Vigo: fagtnavn
        required: true
      grep:
        range: Grep
        description: |
          http://psi.udir.no/ontologi/kl06/fagtype

  Fremmedspråk:
    description: |
      Kilde: https://www.vigo.no/vigokv/fremspr.action
      
      Tabell: FREMSPR
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        description: |
          Vigo: fsprkode
        required: true
      gyldigFoM:
        range: string
        required: true
      gyldigToM:
        range: string
        required: true
      navn:
        range: string
        description: |
          Vigo: fsprnavn
        required: true

  Fylker:
    description: |
      Kilde: https://www.vigo.no/vigokv/fylke.action
      
      Tabell: FYLKE
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      fylkesnummer:
        range: Identifikator
        description: |
          Vigo: fylkesnr
        required: true
      gyldigFoM:
        range: string
        description: |
          Vigo: gyldigfom
        required: true
      gyldigToM:
        range: string
        description: |
          Vigo: gyldigtom
        required: true
      kortnavn:
        range: string
        description: |
          Vigo: navnkort
        required: true
      langnavn:
        range: string
        description: |
          Vigo: navnlang
        required: true
      navn:
        range: string
        description: |
          Vigo: fylke
        required: true
      skoleår:
        range: string
        description: |
          Vigo: skolear
        required: true
      termin:
        range: string
        required: true

  Grep:
    description: |
      Ekstern referanse til Grep kodeverk.
    annotations:
      stereotype: referanse

  Hovedområder:
    description: |
      Delmengde av læreplan for inndeling av det faglige innholdet i logiske blokker
      
      http://psi.udir.no/ontologi/kl06/hovedomraade
      
      http://grepwiki.udir.no/index.php?title=Hovedomr%C3%A5de
      
      Kilde: https://www.vigo.no/vigokv/hovedomraade.action
      
      Tabell: HOVEDOMRAADE
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        description: |
          Finnes ikke i Vigo. Hentes fra Grep hvis den finnes.
      PSI:
        range: Identifikator
        required: true
      beskrivelse:
        range: string
        required: true
      navn:
        range: string
        required: true
      grep:
        range: Grep
        description: |
          http://psi.udir.no/ontologi/kl06/hovedomraade
      kompetansemål:
        range: Kompetansemål
        inverse: hovedområde
        description: |
          Grep relasjon: tilhoerer_hovedomraade
        multivalued: true
      kompetansemålsett:
        range: Kompetansemålsett
        inverse: hovedområde
        annotations:
          primaryRelation: true
        description: |
          Grep relasjon: hovedomraade_relatert_til_kompetansemaalsett
        multivalued: true
      læreplan:
        range: Læreplaner
        inverse: hovedområde
        annotations:
          primaryRelation: true
        description: |
          Grep relasjon: hovedomraader
        multivalued: true

  Karakterer:
    description: |
      Gyldige karakterer og andre vurderingsformer/-uttrykk jfr. skriv fra Utdanningsdirektoratet om Føring av vitnemål og kompetansebevis for videregående opplæring i Kunnskapsløftet, pkt 5 og forskrift til opplæringslova § 3-4.
      
      Utfyllende informasjon: http://regbok.udir.no/35004/3344/35042-1021153.html
      
      Kilde: https://www.vigo.no/vigokv/karakter.action
      
      Tabell: KARAKTER
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        description: |
          Vigo: kar
        required: true
      beskrivelse:
        range: string
        description: |
          Vigo: beskriv
        required: true
      gyldigFoM:
        range: string
        required: true
      gyldigToM:
        range: string
        required: true
      konverteres:
        range: string
        description: |
          Konverteres til karakter
          Vigo: karkonv
        required: true
      teller:
        range: string
        description: |
          Teller som karakter ved beregning av snitt og stryk?
        required: true
      type:
        range: string
        description: |
          Vigo: kartype
        required: true
      verdi:
        range: string
        description: |
          Tallverdi
        required: true

  Kommuner:
    description: |
      Kilde: https://www.vigo.no/vigokv/kommune.action
      
      Tabell: KOMMUNE
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
