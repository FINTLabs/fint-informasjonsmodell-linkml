      Kilde: https://www.vigo.no/vigokv/ekstype.action
      
      Tabell: EKSTYPE
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        required: true
      gyldigFoM:
        range: string
        description: |
          Vigo: gyldigfom
        required: true
      gyldigToM:
        range: string
        description: |
          Vigo: gyldigtom
        required: true
      navn:
        range: string
        required: true
      navnEngelsk:
        range: string
        description: |
          Vigo: navn_eng
        required: true
      navnFransk:
        range: string
        description: |
          Vigo: navn_fra
        required: true
      navnNynorsk:
        range: string
        description: |
          Vigo: navn_nno
        required: true
      navnSamisk:
        range: string
        description: |
          Vigo: navn_sme
        required: true
      navnSpansk:
        range: string
        description: |
          Vigo: navn_spa
        required: true
      navnTysk:
        range: string
        description: |
          Vigo: navn_deu
        required: true

  Eksamensvurderinger:
    description: |
      Kilde: https://www.vigo.no/vigokv/eksamenVurdering.action
      
      Tabell: EKSAMEN_VURDERING
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      PSI:
        range: Identifikator
        description: |
          Unik identifikator
        required: true
      gammelFagkode:
        range: string
        description: |
          Fagkoden dette faget hadde tidligere
          
          Vigo: gammel_fagkode
        required: true
      gyldigFoM:
        range: string
        description: |
          Vigo: gyldigfom
        required: true
      gyldigToM:
        range: string
        description: |
          Vigo: gyldigtom
        required: true
      høyesteNivå:
        range: string
        description: |
          Angir om bare vurdering siste årstrinn faget tas, skal føres på vitnemålet.
          
          Vigo: hoeyeste_nivaa
        required: true
      navn:
        range: string
        required: true
      standpunkt:
        range: string
        description: |
          Om det gis standpunktkarakter i faget.
        required: true
      typeEksamensfag:
        range: string
        description: |
          Vigo: type_eksamensfag
        required: true
      typeEksamensformVitnemål:
        range: string
        description: |
          Eksamensform på vitnemålet.
          
          Vigo: type_eksamensform_vitnemaal
        required: true
      typeEksamensordning:
        range: string
        description: |
          Vigo: type_eksamensordning
        required: true
      typeVurderingsform:
        range: string
        description: |
          Vigo: type_vurderingsform
        required: true

  Fag:
    description: |
      Kilde: https://www.vigo.no/vigokv/fag.action
      
      http://grepwiki.udir.no/index.php?title=Fag
      
      Tabell: FAG
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        description: |
          Alfanumeriske kode for et fag eller en eksamen i ett fag/flere fag (tverrfaglig).
          
          Koden er gitt av Utdanningsdirektoratet gjennom Grep. Alle gyldige koder ligger i VIGO Kodeverksbase
          
          Fagkoder kan søkes opp på https://www.udir.no/laring-og-trivsel/lareplanverket/finn-fagkode/
          
          Innen IB (International Baccalaureate) benyttes egne fagkoder. Disse fagkodene har IBA i de tre første posisjonene.
          
          Utfyllende kommentar: http://regbok.udir.no/35004/3344/35042-1014304.html
        required: true
      PSI:
        range: Identifikator
        description: |
          Unik identifikator, Grep.
        required: true
      elevtgrl:
        range: string
        description: |
          Angir om elevtimer er grunnlag for kursprosent
        required: true
      fagskolen:
        range: string
        description: |
          Fagskole-fag?
        required: true
      førsteEksamen:
        range: string
        description: |
          Første eksamenshalvår
          
          Vigo: foerste_eksamen
        required: true
      førstUndervist:
        range: string
        description: |
          Første undervisningshalvår
          
          Vigo: foerst_undervist
        required: true
      gammelFagkode:
        range: string
        description: |
          Fagkoden dette faget hadde tidligere
          
          Vigo: gammel_fagkode
        required: true
      gyldigFoM:
        range: string
        description: |
          Vigo: gyldigfom
        required: true
      gyldigToM:
        range: string
        description: |
          Vigo: gyldigtom
        required: true
      hjelpemidler:
        range: string
        description: |
          Tillatte hjelpemidler, fri tekst.
        required: true
      hjelpemidlerSentralEksamen:
        range: string
        description: |
          Hjelpemidler som er tillatt på sentral eksamen, fri tekst.
          
          Vigo: hjelpemidler_sentral_eksamen
        required: true
      importer:
        range: string
        required: true
      merknad:
        range: string
        description: |
          Merknader. Offisiell kommentar til eksternt bruk.
        required: true
      navn:
        range: string
        required: true
      navnBokmål:
        range: string
        description: |
          Vigo: navn_nob
        required: true
      navnEngelsk:
        range: string
        description: |
          Vigo: navn_eng
        required: true
      navnFransk:
        range: string
        description: |
          Vigo: navn_fra
        required: true
      navnKortform:
        range: string
        description: |
          Vigo: navn_kortform
        required: true
      navnKortformEngelsk:
        range: string
        description: |
          Vigo: navn_kortform_engelsk
        required: true
      navnKortformNynorsk:
        range: string
        description: |
          Vigo: navn_kortform_nynorsk
        required: true
      navnKortformSamisk:
        range: string
        description: |
          Vigo: navn_kortform_samisk
        required: true
      navnLangt:
        range: string
        description: |
          Vigo: navn_langt
        required: true
      navnNynorsk:
        range: string
        description: |
          Vigo: navn_nno
        required: true
      navnSamisk:
        range: string
        description: |
          Vigo: navn_sme
        required: true
      navnSpansk:
        range: string
        description: |
          Vigo: navn_spa
        required: true
      navnTysk:
        range: string
        description: |
          Vigo: navn_deu
        required: true
      nettoOmfang:
        range: string
        description: |
          I 60-minutters enheter
          
          Vigo: netto_omfang
        required: true
      omfangVitnemål:
        range: string
        description: |
          Omfang påført vitnemål i 60-minutters enheter.
          
          Vigo: omfang_vitnemaal
        required: true
      oppgavetype:
        range: string
        description: |
          Vigo: oppgave
        required: true
      sensurtype:
        range: string
        description: |
          Vigo: sensur
        required: true
      sisteEksamen:
        range: string
        description: |
          Siste eksamenshalvår
          
          Vigo: siste_eksamen
        required: true
      sistUndervist:
        range: string
        description: |
          Siste undervisningshalvår
          
          Vigo: sist_undervist
        required: true
      standardKommentar:
        range: string
        description: |
          Vigo: standard_kommentar
        required: true
      totaltOmfang:
        range: string
        description: |
          I 60-minutters enheter
          
          Vigo: totalt_omfang
        required: true
      tverrfag:
        range: string
        description: |
          Tverrfaglig eksamen?
        required: true
      utenStandpunkt:
        range: string
