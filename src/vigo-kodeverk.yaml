          Fellesfag uten standpunktkarakter?
          
          Vigo: uten_standpunkt
        required: true
      utgått:
        range: string
        description: |
          Er faget utgått?
          
          Vigo: utgaatt
        required: true
      årstimerStatistikk:
        range: string
        description: |
          Vigo: aarstimer_statistikk
        required: true
      eksamensVurderingElev:
        range: Eksamensvurderinger
        description: |
          Grep relasjon: eksamen_vurdering_elev
      eksamensVurderingPrivatist:
        range: Eksamensvurderinger
        description: |
          Grep relasjon: eksamen_vurdering_privatist
      erstatter:
        range: Fag
        description: |
          Grep relasjon: element_erstatter_element
      fagtype:
        range: Fagtyper
        required: true
      grep:
        range: Grep
        description: |
          http://psi.udir.no/ontologi/kl06/fagkode
      merkelapp:
        range: Merkelapper
        description: |
          Grep relasjon: merkelapp_relatert_til
      opplæringsfag:
        range: Opplæringsfag
        inverse: delfag
        annotations:
          primaryRelation: true
        description: |
          Grep relasjon: hovedfag_delfag
      påbygning:
        range: Fag
        description: |
          Grep relasjon: fag_paabygning
        multivalued: true
      standardKommentar:
        range: Fagmerknader
        description: |
          Grep relasjon: knytning?
      tilhørerProgramområde:
        range: Programområder
        inverse: fagUnderProgramområde
        description: |
          Grep relasjon: fag_tilhoerer_programomraade
        multivalued: true

  Fagmerknader:
    description: |
      Kilde: https://www.vigo.no/vigokv/fam.action
      
      Tabell: FAGMERKNAD
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
