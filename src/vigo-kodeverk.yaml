        required: true
      gyldigFoM:
        range: string
        description: |
          Vigo: gyldigfom
        required: true
      gyldigToM:
        range: string
        description: |
          Vigo: gyldigtom
        required: true
      navn:
        range: string
        description: |
          Vigo: kommune
        required: true
      fylkesnummer:
        range: Fylker
        required: true

  Kompetansemål:
    description: |
      Kompetanse en elev skal ha oppnådd etter endt opplæring på et gitt nivå/trinn
      
      http://psi.udir.no/ontologi/kl06/kompetansemaal
      
      http://grepwiki.udir.no/index.php?title=Kompetansem%C3%A5l
      
      Kilde: https://www.vigo.no/vigokv/kompetansemaal.action
      
      Tabell: KOMPETANSEMAAL
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        required: true
      PSI:
        range: Identifikator
        required: true
      gammelKode:
        range: string
        required: true
      navn:
        range: string
        required: true
      grep:
        range: Grep
        description: |
          http://psi.udir.no/ontologi/kl06/kompetansemaal
      hovedområde:
        range: Hovedområder
        inverse: kompetansemål
        annotations:
          primaryRelation: true
        description: |
          Grep relasjon: tilhoerer_hovedomraade
        multivalued: true
      kompetansemålsett:
        range: Kompetansemålsett
        inverse: kompetansemål
        description: |
          Grep relasjon: kompetansemaalsett_har_kompetansemaal
        multivalued: true

  Kompetansemålsett:
    description: |
      Et sett med kompetansemål, gruppert under hovedområder, som gjelder for et angitt sett med trinn eller nivå.
      
      http://psi.udir.no/ontologi/kl06/kompetansemaalsett
      
      http://grepwiki.udir.no/index.php?title=Kompetansem%C3%A5lsett
      
      Kilde: https://www.vigo.no/vigokv/kompetansemaalsett.action
      
      Tabell: KOMPETANSEMAALSETT
      
      Dokumentasjon: http://www.vigoiks.no/systeminformasjon/informasjon-vigo-opplaering/dokumentbase/grensesnitt-mellom-vigo-sas-og-grep
    attributes:
      kode:
        range: Identifikator
        description: |
          Finnes ikke i Vigo. Hentes fra Grep hvis den finnes.
      PSI:
        range: Identifikator
        required: true
      navn:
        range: string
        required: true
      årstrinn:
        range: string
        description: |
          vigokv feltnavn: aarstrinn
        required: true
      fag:
        range: Opplæringsfag
        inverse: kompetansemålsett
        description: |
          Grep relasjon: kompetansemaalsett_etter_fag
        multivalued: true
      grep:
        range: Grep
        description: |
          http://psi.udir.no/ontologi/kl06/kompetansemaalsett
      hovedområde:
        range: Hovedområder
        inverse: kompetansemålsett
        description: |
          Grep relasjon: hovedomraade_relatert_til_kompetansemaalsett
        multivalued: true
      kompetansemål:
        range: Kompetansemål
        inverse: kompetansemålsett
        annotations:
          primaryRelation: true
        description: |
          Grep relasjon: kompetansemaalsett_har_kompetansemaal
        multivalued: true
      læreplan:
        range: Læreplaner
        inverse: kompetansemålsett
        annotations:
