          Vigo: navn_nob
        required: true
      navnEngelsk:
        range: string
        description: |
          Vigo: navn_eng
        required: true
      navnKortform:
        range: string
        description: |
          Vigo: navn_kortform
        required: true
      navnKortformEngelsk:
        range: string
        description: |
          Vigo: navn_kortform_engelsk
        required: true
      navnKortformNynorsk:
        range: string
        description: |
          Vigo: navn_kortform_nynorsk
        required: true
      navnKortformSamisk:
        range: string
        description: |
          Vigo: navn_kortform_samisk
        required: true
      navnNynorsk:
        range: string
        description: |
          Vigo: navn_nno
        required: true
      navnSamisk:
        range: string
        description: |
          Vigo: navn_sme
        required: true
      sistEndret:
        range: string
        description: |
          Vigo: sist_endret
        required: true
      standardkommentarVitnemålType:
        range: string
        description: |
          Vigo: standardkommentar_vitnemaal_ty
        required: true
      utgått:
        range: string
        description: |
          Vigo: utgaatt
        required: true
      videregående:
        range: string
