# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/utdanning/basisklasser
name: utdanning.basisklasser
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper
  - utdanning.elev
  - utdanning.kodeverk
  - utdanning.utdanningsprogram

classes:

  Gruppe:
    description: |
      En generisk samling av elever og lærere
      
      # Beskrivelse 
      
      Gruppe representeres som en spesialisering (se tabell nedenfor).
      
      Grupper knyttes til Utdanningsforhold via Medlemskap.
      
      En gruppe kan ha en kode, og den kan ha en periode. Hvorvidt den har kode eller periode avhenger av hva slags konkret klasse som benyttes.
      
      Koden knyttes til kodeverk om igjen knyttes til Vigo/Grep, mens perioden angir når gruppen er gyldig i tid, for eksempel for et skoleår, en termin, eller en eksamensperiode.
      
      | Klasse | Kode | Periode |
      | ------- | ----- | ------ |
      | Basisgruppe | | X |
      | Kontaktlærergruppe | | X |
      | Utdanningsprogram | X | |
      | Programområde | X | |
      | Fag | X | |
      | Årstrinn | X | |
      | Eksamensgruppe | X | X |
      | Undervisningsgruppe | X | X |
    abstract: true
    attributes:
      systemId:
        range: Identifikator
        description: |
          Unik intern system-id for gruppe
          
          # Beskrivelse
          
          Systemspesifikk id, som normalt ikke er synlig i fagsystemet.
        required: true
      beskrivelse:
        range: string
        description: |
          Utfyllende informasjon om gruppen
        required: true
      navn:
        range: string
        description: |
          Navn på gruppe
        required: true
      periode:
        range: Periode
        description: |
          Perioder som gruppen er gyldig eller relevant for.
          
          # Beskrivelse
          
          Kan brukes for å angi at en gruppe gjelder for et skoleår, en termin eller en eksamensperiode.
          
          Flere perioder kan knyttes til en gruppe. Dette kan eksempelvis benyttes for å representere komprimerte eller utvidete utdanningsløp.
        multivalued: true
      grepreferanse:
        range: Grepreferanse
        description: |
          Referanse til Grep-kode.
      medlemskap:
        range: Medlemskap
        inverse: gruppe
        description: |
          Alle medlemene (medlemskapsforholdene) i en gruppe
        multivalued: true
      vigoreferanse:
        range: Vigoreferanse
        description: |
          Referanse til VIGO kode.

  Utdanningsforhold:
    description: |
      Et felles begrep for rollene til mennesker (elever, lærere, sensorer osv) som deltar i undervisning
      
      # Beskrivelse 
      
      Abstrakt klasse som inneholder relasjoner og informasjon som brukes som elevforhold eller undervisningsforhold.
      
      # Eksempel
      
      * Lærer
      * Elev
      * Sensor
    abstract: true
    attributes:
      systemId:
        range: Identifikator
        description: |
          Systemidentifikator i fagsystem
          
          # Beskrivelse 
          
          Dette kan være identifikator som eksisterer i skoleadministrativt system.
        required: true
      beskrivelse:
        range: string
        description: |
          Beskrivende tekst om personens forhold
        required: true
      medlemskap:
        range: Medlemskap
        inverse: medlem
        description: |
          Alle gruppene som elev eller lærer er medlem av.
        multivalued: true
      skole:
        range: Skole
        inverse: utdanningsforhold
        annotations:
          primaryRelation: true
        description: |
          Skole som utdanningsforhold er knyttet til.
