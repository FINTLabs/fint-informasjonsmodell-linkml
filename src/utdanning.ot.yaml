# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/utdanning/ot
name: utdanning.ot
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper
  - felles
  - utdanning.kodeverk
  - utdanning.utdanningsprogram

classes:

  OTUngdom:
    description: |
      Oppfølgingstjenesten (OT) har ansvar for å følge opp ungdom med rett til videregående opplæring som ikke er i opplæring eller arbeid.
    attributes:
      systemId:
        range: Identifikator
        description: |
          Unik identifikator for OT-ungdom
        required: true
      enhet:
        range: OTEnhet
        description: |
          OT-enheten en OT-ungdom er tilknyttet.
      person:
        range: Person
        inverse: otungdom
        annotations:
          primaryRelation: true
        description: |
          Person som er OT-ungdom.
        required: true
      programområdemedlemskap:
        range: Programområdemedlemskap
        inverse: otungdom
        annotations:
          primaryRelation: true
        description: |
          Programområdemedlemskapene til en OT-ungdom i inneværende skoleår.
        multivalued: true
      status:
        range: OTStatus
        description: |
          OT-statusen en OT-ungdom har.
