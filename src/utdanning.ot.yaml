# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/utdanning/ot
name: utdanning.ot
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper
  - felles
  - utdanning.kodeverk
  - utdanning.utdanningsprogram

classes:

  OtUngdom:
    description: |
      Oppf&#248;lgingstjenesten (OT) har ansvar for &#229; f&#248;lge opp ungdom med rett til videreg&#229;ende oppl&#230;ring som ikke er i oppl&#230;ring eller arbeid.
    attributes:
      systemId:
        range: Identifikator
        description: |
          Unik identifikator for OT-ungdom
        required: true
      enhet:
        range: OtEnhet
        description: |
          OT-enheten en OT-ungdom er tilknyttet.
      person:
        range: Person
        inverse: otungdom
        annotations:
          primaryRelation: true
        description: |
          Person som er OT-ungdom.
        required: true
      programområde:
        range: Programområde
        description: |
          Programområdet til OT-ungdom.
      status:
        range: OtStatus
        description: |
          OT-statusen en OT-ungdom har.
