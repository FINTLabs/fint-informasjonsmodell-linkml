  Vurdering:
    description: |
      Karakterer og andre vurderingsuttrykk.
      
      # Beskrivelse
      
      Vurdering gis for deltakelse av en elev i en gruppe. Dette kan være Halvårsvurdering, Standpunktkarakter, underveisvurdering eller annet. 
      
      Vurdering i fag skal ha relasjon til den `Undervisningsgruppe` eller `Eksamensgruppe` som vurderingen er foretatt i. Det er også mulig å sette relasjon direkte til angjeldende fag.
      
      Vurderinger av orden og andre frittstående vurderinger gjøres uten relasjon til noen gruppe.
      
      # Referanser
      
      * UDir. Registreringshåndbok, Karakterer og andre vurderingsuttrykk: [regbok.udir.no/35004/3344/35042-1021153.html](http://regbok.udir.no/35004/3344/35042-1021153.html)
      * Føring av vitnemål og kompetansebevis for videregående opplæring i Kunnskapsløftet 2017. Karakterer og andre vurderingsuttrykk: [https://www.udir.no/eksamen-og-prover/dokumentasjon/vitnemal-og-kompetansebevis/foring-vitnemal-kompetansebevis-vgs/5-karakterer-og-andre-vurderingsuttrykk/](https://www.udir.no/eksamen-og-prover/dokumentasjon/vitnemal-og-kompetansebevis/foring-vitnemal-kompetansebevis-vgs/5-karakterer-og-andre-vurderingsuttrykk/)
      * Forskrift til opplæringslova &#167; 3-4: [https://lovdata.no/dokument/SF/forskrift/2006-06-23-724/KAPITTEL_4-1#&#167;3-4](https://lovdata.no/dokument/SF/forskrift/2006-06-23-724/KAPITTEL_4-1#&#167;3-4)
    deprecated: "Bruk Fagvurdering og Ordensvurdering."
    attributes:
      systemId:
        range: Identifikator
        description: |
          Kildesystemets unike identifikator for vurdering.
        required: true
      endelig:
        range: boolean
        description: |
          Angir om vurderingen er endelig.
          
          # Beskrivelse
          
          Vurderinger som ikke er endelige, regnes som underveisvurderinger.
        required: true
      kommentar:
        range: string
        description: |
          Kommentar til vurderingen.
        required: true
      eksamensgruppe:
        range: Eksamensgruppe
        description: |
          Eksamensgruppe vurderingen er foretatt i.
      elevforhold:
        range: Elevforhold
        inverse: vurdering
        annotations:
          primaryRelation: true
        description: |
          Elevforhold som er vurdert.
        deprecated: "Bruk Fagvurdering og Ordensvurdering"
      fag:
        range: Fag
        description: |
          Hvilket fag vurderingen gjelder
      karakter:
        range: Karakterverdi
        description: |
          Det aktuelle karakteren som er tildelt
        required: true
      undervisningsgruppe:
        range: Undervisningsgruppe
        description: |
          Undervisningsgruppe vurderingen er foretatt i.
