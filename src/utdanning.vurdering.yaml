# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/utdanning/vurdering
name: utdanning.vurdering
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper
  - utdanning.basisklasser
  - utdanning.kodeverk
  - utdanning.timeplan

classes:

  Eksamensgruppe:
    description: |
      Gruppering av elever som tar samme eksamen 
      
      # Beskrivelse
      
      Underordnet til fag.
      
      Kan brukes for å:
      * Vise forhold mellom eksamensresultat og sensor
      * Vise gruppering av elever som tok eksamen sammen
      
      Det er også mulig å koble resultater av eksamener direkte på klasse `Fag`.
      
      Eksamensgrupper har en kode som er sentralt definert av VIGO.
    is_a: Gruppe
    attributes:
      fag:
        range: Fag
        description: |
          Det faget som eksamen har vært i
        required: true

  Karakterverdi:
    description: |
      Karakterer, målestokk for vurdering av elevers faglige standpunkt, prøve- eller eksamensprestasjoner
      
      # Beskrivelse
      
      De enkelte karakterer, som til sammen danner en karakterskala, blir betegnet med tall eller andre symboler.
      
      Den relaterte skalaen må refereres fra selve verdi.
      
      # Eksempel
      
      * 6 - Seks
      * IM - Ikke møtt
      * GK - Godkjent
      * R - Realkompetanse
      
      # Referanse
      
      * Vigo Kodeverkdatabase. Karakter: [vigo.no/vigokv/karakter.action](https://www.vigo.no/vigokv/karakter.action)
      * SNL. karakterer: [snl.no/karakterer](https://snl.no/karakterer)
    is_a: Begrep
    attributes:
      skala:
        range: Karakterskala
        inverse: verdi
        annotations:
          primaryRelation: true
        description: |
          Skala som karakter er definert i
          
          # Eksempel
          
          * 5 er definer på Tall skala
        required: true
