# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json
id: https://w3id.org/novari/fint/utdanning/elev
name: utdanning.elev
imports:
  - linkml:types
  - felles.basisklasser
  - felles.komplekse-datatyper
  - administrasjon.personal
  - felles
  - utdanning.basisklasser
  - utdanning.kodeverk
  - utdanning.timeplan
  - utdanning.utdanningsprogram
  - utdanning.vurdering

classes:

  Basisgruppe:
    description: |
      Elevgruppe som definert i Opplæringslova §8-2. 
      
      # Beskrivelse
      
      I opplæringa skal elevane delast i klassar eller basisgrupper som skal vareta deira behov for sosialt tilhør. For delar av opplæringa kan elevane delast i andre grupper etter behov. Til vanleg skal organiseringa ikkje skje etter fagleg nivå, kjønn eller etnisk tilhør. Klassane, basisgruppene og gruppene må ikkje vere større enn det som er pedagogisk og tryggleiksmessig forsvarleg.
      
      Klassen eller basisgruppa skal ha ein eller fleire lærarar (kontaktlærarar) som har særleg ansvar for dei praktiske, administrative og sosialpedagogiske gjeremåla som gjeld klassen eller basisgruppa og dei elevane som er der, mellom anna kontakten med heimen.
      
      Begrepet som har tildligere vært kjent som "klasse".
      
      "Vanlig" gruppe i SATS (klassegruppe)
      
      Viser informasjon om:
      * År på VGS person går i
      * Programområdet
      * A, B eller C klasse
      
      Synonym:
      * Klasse
      
      Øvre grense er beskrevet i Opplæringslova §8-3 eller i forskrift.
    is_a: Gruppe
    attributes:
      elevforhold:
        range: Elevforhold
        inverse: basisgruppe
        description: |
          Alle elevforhold i basisgruppen.
        multivalued: true
      kontaktlærergruppe:
        range: Kontaktlærergruppe
        inverse: basisgruppe
        description: |
          Grupper med en kontaktlærer og elever som ligger under en gitt basisgruppe
        multivalued: true
      skole:
        range: Skole
        inverse: basisgruppe
        annotations:
          primaryRelation: true
        description: |
          Skolen en basisgruppe tilhører.
        required: true
      trinn:
        range: Årstrinn
        description: |
          Det overordnet trinnet som gruppen hører inn i
        required: true
      undervisningsforhold:
        range: Undervisningsforhold
        inverse: basisgruppe
        description: |
          Alle lærere tilknyttet basisgruppen.
        multivalued: true

  Elev:
    description: |
      Informasjon om en person som mottar undervisning.
      
      # Beskrivelse 
      
      Beskriver informasjon relatert til undervisning for en Person.
      
      Tilsvarende finnes for ansatte: __Personalressurs__.
    attributes:
      brukernavn:
        range: Identifikator
        annotations:
          writeable: true
        description: |
          Brukernavn til en elev
          
          # Beskrivelse
          
          Skal inneholde brukernavn for pålogging, som finnes i katalogtjenesten (feks Active Directory). Brukes som en identifikator som består, når fødselsnummer og/eller andre identifikatorer endrer seg.
          
          # Format
          
          Brukernavn i det format en elev trenger for å logge seg på systemer i organisasjonen.
          
          # NB!
          
          Fremtidig funksjon for dette feltet er under revisjon.
      elevnummer:
        range: Identifikator
        description: |
          Et unikt nummer som identifiserer en elev
      feidenavn:
        range: Identifikator
        annotations:
          writeable: true
        description: |
          Fullt Feide-navn
          
          # Beskrivelse
          Dette er det samme som `eduPersonPrincipalName` i Feide skjemaet. Se [eduPersonPrincipalName](https://docs.feide.no/schema/info_go/go_attributter_ch02.html#edupersonprincipalname) for utdypende informasjon.
          
          # Eksempel
          - oleolsen@haugaland.fylkeskommune.no
      systemId:
        range: Identifikator
        description: |
          Systemidentifikator til en elev.
          
          # Beskrivelse 
          
          Dette kan være identifikator som eksisterer i SAS/SIS (IPOS/OID).
        required: true
      kontaktinformasjon:
        range: Kontaktinformasjon
        annotations:
          writeable: true
        description: |
          Skolespesifikk kontaktinformasjon til en elev
          
          # Beskrivelse
          
          Den fortrukne måten å komme i kontakt med en elev på skolen.
      elevforhold:
        range: Elevforhold
        inverse: elev
        description: |
          Elevforholdene til en elev
        multivalued: true
      person:
        range: Person
        inverse: elev
        annotations:
          primaryRelation: true
        description: |
          Privatperson som er knyttet til en elev
        required: true

  Elevforhold:
    description: |
      Elevens forskjellige utdanningsforhold
      
      # Beskrivelse
      
      En Elev kan ha flere Elevforhold.
      
      # Eksempel
      
      En elev kan være i elevforhold med status privatist og deltid samtidig. Eller en elev kan ha flere elevforhold på flere forskjellige skoler.
    is_a: Utdanningsforhold
    attributes:
      basisgruppe:
        range: Basisgruppe
        inverse: elevforhold
        annotations:
          primaryRelation: true
        description: |
          Alle basisgrupper elevforholdet er medlem av.
        multivalued: true
      eksamensgruppe:
        range: Eksamensgruppe
        inverse: elevforhold
        annotations:
          primaryRelation: true
        description: |
          Alle eksamensgruppene elevforhold er medlem av.
        multivalued: true
      elev:
        range: Elev
        inverse: elevforhold
        annotations:
          primaryRelation: true
        description: |
          Elev som elevforholdet gjelder for
        required: true
      fravær:
        range: Fravær
        inverse: elevforhold
        description: |
          Alle fravær registrert på elevforhold.
        multivalued: true
      kategori:
        range: Elevkategori
        description: |
          Kategori på et elevforhold
      kontaktlærergruppe:
        range: Kontaktlærergruppe
        inverse: elevforhold
        annotations:
          primaryRelation: true
        description: |
          Alle kontaktlærergrupper elevforhold er medlem av.
        multivalued: true
      programområde:
        range: Programområde
        inverse: elevforhold
        annotations:
          primaryRelation: true
        description: |
          Programområde elevforhold tilhører
      skole:
        range: Skole
        inverse: elevforhold
        annotations:
          primaryRelation: true
        description: |
          Skole elevforhold er knyttet til.
        required: true
      undervisningsgruppe:
        range: Undervisningsgruppe
        inverse: elevforhold
        annotations:
          primaryRelation: true
        description: |
          Alle undervisningsgruppene elevforhold er medlem av.
        multivalued: true
      vurdering:
        range: Vurdering
        inverse: elevforhold
        description: |
          Alle vurderinger i et elevforhold
        multivalued: true

  Kontaktlærergruppe:
    description: |
      Elevgruppe som ein kontaktlærer har særleg ansvar for.
      
      # Beskrivelse
      
      Kontaktlæreren har i denne gruppa særleg ansvar for dei praktiske, administrative og sosialpedagogiske gjeremåla som gjeld klassen eller basisgruppa og dei elevane som er der, mellom anna kontakten med heimen, jf Opplæringslova §8-2.
    is_a: Gruppe
    attributes:
      basisgruppe:
        range: Basisgruppe
        inverse: kontaktlærergruppe
        annotations:
          primaryRelation: true
        description: |
          De overordnede basisgruppene
        multivalued: true
        required: true
      elevforhold:
        range: Elevforhold
        inverse: kontaktlærergruppe
        description: |
          Alle elevforhold i kontaktlærergruppen.
        multivalued: true
      skole:
        range: Skole
        inverse: kontaktlærergruppe
        annotations:
          primaryRelation: true
        description: |
          Skolen kontaktlærergruppen tilhører.
        required: true
      undervisningsforhold:
        range: Undervisningsforhold
        inverse: kontaktlærergruppe
        description: |
          Alle kontaktlærere i gruppen.
        multivalued: true

  Medlemskap:
    description: |
      Måte å definere at en gitt elev eller lærer deltar i en gruppe. Informasjonen om fravær og elevens karakterer er definert ved hjelp av dette objektet.
      
      # Eksempler
      
      * Elevers medlemskap i Undervisningsgrupper
      * Lærerens medlemskap i Kontaktgruppe
      * Viser Elevens fravær fra en gitt undervisningsgruppe
    deprecated: "Medlemskap uttrykkes som relasjoner direkte mellom Undervisningsforhold og Gruppe."
    attributes:
      systemId:
        range: Identifikator
        description: |
          Systemidentifikator i fagsystem
          
          # Beskrivelse 
          
          Dette kan være identifikator som eksisterer i SAS (SATS, Extens).
        deprecated: "DEPRECATED"
        required: true
      gruppe:
        range: Gruppe
        inverse: medlemskap
        annotations:
          primaryRelation: true
        description: |
          Gruppen som omtales i medlemskapet
        deprecated: "Erstattet av relasjon mellom Elevforhold / Undervisningsforhold og grupper."
        required: true
      medlem:
        range: Utdanningsforhold
        inverse: medlemskap
        annotations:
          primaryRelation: true
        description: |
          Alle deltakere i medlemskapet. Det er viktig å notere at det er både elevene og lærere som inngår i medlemskap i grupper.
        deprecated: "Erstattet av relasjon mellom Undervisningsforhold og Elevforhold og grupper."
        required: true
      endeligVurdering:
        range: Vurdering
        description: |
          Den endelige vurderingen som eleven har fått som resultat av deltakelse i en gruppe
        deprecated: "Erstattet av relesjon mellom Elevforhold og Vurdering"
      fortløpendeVurdering:
        range: Vurdering
        description: |
          Fortløpende vurdering som eleven har fått som resultat av deltakelse i en gruppe
          
          # Eksempler
          
          - Terminkarakter
        deprecated: "Erstattet av relasjon mellom Elevforhold og Vurdering"
        multivalued: true
      fravær:
        range: Fravær
        description: |
          Fraværet til både lærer og elev som har vært registrert innen en gitt gruppe.
        deprecated: "Erstattet av relasjon mellom Elevforhold og Fravær"
        multivalued: true

  Skoleressurs:
    description: |
      Ansatte på en skole.
      
      # Beskrivelse
      
      Kan være undervisningspersonell eller andre administrativt ansatte.
    attributes:
      feidenavn:
        range: Identifikator
        annotations:
          writeable: true
        description: |
          Fullt Feide-navn
          
          # Beskrivelse
          Dette er det samme som `eduPersonPrincipalName` i Feide skjemaet. Se [eduPersonPrincipalName](https://docs.feide.no/schema/info_go/go_attributter_ch02.html#edupersonprincipalname) for utdypende informasjon.
          
          # Eksempel
          - oleolsen@haugaland.fylkeskommune.no
      systemId:
        range: Identifikator
        description: |
          Kildesystemets interne identifikator for skoleressurs.
        required: true
      personalressurs:
        range: Personalressurs
        inverse: skoleressurs
        annotations:
          primaryRelation: true
        description: |
          Relasjon til informasjon om ansettelsesforhold.
        required: true
      skole:
        range: Skole
        inverse: skoleressurs
        annotations:
          primaryRelation: true
        description: |
          Tilknyttede skoler.
        multivalued: true
      undervisningsforhold:
        range: Undervisningsforhold
        inverse: skoleressurs
        annotations:
          primaryRelation: true
        description: |
          Undervisningsforhold for skoleressurs.
        multivalued: true

  Undervisningsforhold:
    description: |
      Undervisningsforhold til alle med en pedagogisk funksjon
      
      # Beskrivelse 
      
      Alle med en pedagogisk funksjon på skolen kan ha et undervisningsforhold.
      
      # Eksempel
      
      Dette kan for eksempel være lærerens undervisningsforhold til skolen. Underviser en lærer på to skoler, vil det være naturlig å ha to undervisningsforhold.
    is_a: Utdanningsforhold
    attributes:
      time:
        range: Time
        inverse: undervisningsforhold
        annotations:
          primaryRelation: true
        description: |
          Timer hvor lærer underviser
        multivalued: true
      arbeidsforhold:
        range: Arbeidsforhold
        inverse: undervisningsforhold
        annotations:
          primaryRelation: true
        description: |
          Relasjon til en tilsvarende objekt i Adminstrasjons domenet
        required: true
      basisgruppe:
        range: Basisgruppe
        inverse: undervisningsforhold
        annotations:
          primaryRelation: true
        description: |
          Alle basisgrupper tilknyttet læreren.
        multivalued: true
      eksamensgruppe:
        range: Eksamensgruppe
        inverse: undervisningsforhold
        annotations:
          primaryRelation: true
        description: |
          Alle eksamensgruppene tilknyttet læreren.
        multivalued: true
      kontaktlærergruppe:
        range: Kontaktlærergruppe
        inverse: undervisningsforhold
        annotations:
          primaryRelation: true
        description: |
          Alle grupper læreren er kontaktlærer for.
        multivalued: true
      skole:
        range: Skole
        inverse: undervisningsforhold
        annotations:
          primaryRelation: true
        description: |
          Skole som undervisningsforhold er tilknyttet.
        required: true
      skoleressurs:
        range: Skoleressurs
        inverse: undervisningsforhold
        description: |
          Skoleressurs for undervisningsforhold.
        required: true
      undervisningsgruppe:
        range: Undervisningsgruppe
        inverse: undervisningsforhold
        annotations:
          primaryRelation: true
        description: |
          Alle undervisningsgrupper læreren deltar i.
        multivalued: true
